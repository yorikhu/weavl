packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@parcel/watcher": true
  "@prisma/engines": true
  prisma: true
  sharp: true
  unrs-resolver: true

# pnpm 11+ 设置已从 package.json 的 pnpm 字段迁移至此
onlyBuiltDependencies:
  - "@prisma/engines"
  - prisma
  - sharp
  - unrs-resolver
  - "@parcel/watcher"

verifyDepsBeforeRun: false
