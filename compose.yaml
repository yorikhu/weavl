name: weavl

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-http://deb.debian.org/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-http://deb.debian.org/debian-security}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    command: ["pnpm", "--filter", "@weavl/api", "db:deploy"]
    environment: &api-environment
      NODE_ENV: production
      PORT: 3001
      WEAVL_WEB_ORIGINS: ${WEAVL_PUBLIC_ORIGIN}
      WEAVL_COOKIE_SECURE: ${WEAVL_COOKIE_SECURE:-false}
      WEAVL_DEMO_EMAIL: ${WEAVL_DEMO_EMAIL}
      WEAVL_DEMO_PASSWORD: ${WEAVL_DEMO_PASSWORD}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      WEAVL_REDIS_PREFIX: weavl
      WEAVL_LOGIN_MAX_FAILURES: 5
      WEAVL_LOGIN_LOCK_SECONDS: 300
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      OBJECT_STORAGE_BUCKET: weavl
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      WEAVL_PROVIDER_TIMEOUT_MS: 30000
      WEAVL_IMAGE_TIMEOUT_MS: 120000
      WEAVL_VIDEO_TIMEOUT_MS: 30000
      WEAVL_VIDEO_GENERATION_ENABLED: ${WEAVL_VIDEO_GENERATION_ENABLED:-false}
      WEAVL_PROVIDER_MAX_ATTEMPTS: 2
      WEAVL_PROVIDER_RETRY_BASE_MS: 750
      WEAVL_QUEUE_PREFIX: weavl:queue
      WEAVL_GENERATION_QUEUE_ATTEMPTS: 2
      WEAVL_GENERATION_QUEUE_RETRY_DELAY_MS: 2000
      WEAVL_GENERATION_WORKER_CONCURRENCY: ${WEAVL_GENERATION_WORKER_CONCURRENCY:-10}
      WEAVL_GENERATION_USER_CONCURRENCY: ${WEAVL_GENERATION_USER_CONCURRENCY:-2}
      WEAVL_GENERATION_USER_SLOT_LEASE_MS: ${WEAVL_GENERATION_USER_SLOT_LEASE_MS:-300000}
      WEAVL_GENERATION_USER_SLOT_RETRY_DELAY_MS: ${WEAVL_GENERATION_USER_SLOT_RETRY_DELAY_MS:-500}
      GEEKNOW_API_KEY: ${GEEKNOW_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-http://deb.debian.org/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-http://deb.debian.org/debian-security}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    environment:
      <<: *api-environment
      WEAVL_RUN_GENERATION_WORKER: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-http://deb.debian.org/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-http://deb.debian.org/debian-security}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    command: ["pnpm", "--filter", "@weavl/api", "start:worker"]
    restart: unless-stopped
    environment:
      <<: *api-environment
      WEAVL_RUN_GENERATION_WORKER: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_ASSET_PREFIX: ""
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  minio-data:
